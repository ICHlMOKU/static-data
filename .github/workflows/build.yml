name: build

# Builds a merged XMLTV guide from iptv-org's grabbers, daily.
#
# This repo exists ONLY to run this job and hold its output. Nothing else lives here, and the
# output is public TV listings scraped from public broadcaster sites — no credentials, no
# playlists, no application code.
#
# WHY IT IS PUBLIC. Grabbing all ~180,000 channels takes roughly 700 build-minutes a day. Private
# repos get ~66 free minutes a day, so the full set is only affordable on a public repo, where
# Actions minutes are unlimited. That is the entire reason.
#
# SHARDED, NOT HARDCODED. The site list is read from iptv-org at runtime and split across 20
# parallel jobs by index, so it follows their repo as sites are added or removed and never needs
# editing here. Wall-clock is ~1/20th of the total.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false           # a dead site must never lose the other shards
      max-parallel: 20
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: { repository: iptv-org/epg, ref: master, path: epg-tool }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        working-directory: epg-tool
        run: npm install --no-audit --no-fund
      - name: Select this shard's sites
        id: pick
        working-directory: epg-tool
        run: |
          # Every 20th site, offset by shard index — an even split without needing to know the
          # total, and stable as long as the directory listing is sorted.
          # CURATED, not all 537. Grabbing everything produced 80,558 channels /
          # 1,514,194 programmes = 812MB of XML, and the Apple TV is killed by tvOS well
          # before that: its 641MB footprint on a 109k-programme guide already trips the
          # 900MB shed. Size is bounded by CHANNEL COUNT, so the fix is fewer sites, not
          # fewer days. These cover the measured gaps (IT/ES/satellite/Balkans).
          ALL="sat.tv_en,sat.tv_ar,superguidatv.it,guidatv.sky.it,movistarplus.es,programacion-tv.elpais.com,epg.iptvx.one,streamingtvguides.com,tv24.co.uk,m.tv.sms.cz,mi.tv_es,mi.tv_br,gatotv.com,tvtv.us"
          SITES=$(echo "$ALL" | tr ',' '\n' | awk "NR % 6 == ${{ matrix.shard }}" | paste -sd, -)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }}: $(echo $SITES | tr ',' '\n' | wc -l) sites"
      - name: Grab
        working-directory: epg-tool
        continue-on-error: true
        run: |
          npm run grab -- --sites="${{ steps.pick.outputs.sites }}" \
            --maxConnections=20 --days=1 --timeout=30000 \
            --output=guide.xml || echo "partial output kept"
      - uses: actions/upload-artifact@v4
        with:
          name: guide-${{ matrix.shard }}
          path: epg-tool/guide.xml
          if-no-files-found: warn
          retention-days: 1

  publish:
    needs: grab
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: self, fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: guide-* }
      - name: Merge
        id: merge
        run: |
          python3 - <<'PY'
          import glob, re, io
          # Streaming text merge, not a DOM parse: combined input is hundreds of MB and lxml would
          # exhaust the runner. XMLTV is a flat <tv> of <channel>/<programme>, so concatenation is
          # sound; channel ids are deduped because shards overlap on shared channels.
          seen, n_ch, n_pr = set(), 0, 0
          out = io.open('merged.xml','w',encoding='utf-8')
          out.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
          files = sorted(glob.glob('parts/**/guide.xml', recursive=True))
          print('shards merged:', len(files))
          for f in files:
              body = io.open(f,encoding='utf-8',errors='ignore').read()
              for m in re.finditer(r'<channel\b.*?</channel>', body, re.S):
                  cid = re.search(r'id="([^"]*)"', m.group(0))
                  k = cid.group(1) if cid else m.group(0)[:60]
                  if k in seen: continue
                  seen.add(k); out.write(m.group(0)+'\n'); n_ch += 1
              for m in re.finditer(r'<programme\b.*?</programme>', body, re.S):
                  out.write(m.group(0)+'\n'); n_pr += 1
          out.write('</tv>\n'); out.close()
          print(f'channels={n_ch} programmes={n_pr}')
          # Trailing newline matters: `read` returns non-zero at EOF without one and `bash -e`
          # then kills the step AFTER it has succeeded.
          open('counts.txt','w').write(f'{n_ch} {n_pr}\n')
          PY
          read CH PR < counts.txt || true
          echo "channels=$CH"   >> "$GITHUB_OUTPUT"
          echo "programmes=$PR" >> "$GITHUB_OUTPUT"
          echo "merged: $CH channels / $PR programmes"
      - name: Verify
        run: |
          read CH PR < counts.txt || true
          # Partial is fine; empty must never replace a good guide.
          if [ "$PR" -lt 20000 ]; then echo "only $PR programmes — refusing to publish"; exit 1; fi
          # UPPER bound too. An oversized guide is not a better guide: 812MB of XML gets the
          # Apple TV killed by tvOS rather than merely slowed, so refuse to ship one.
          if [ "$PR" -gt 400000 ]; then echo "$PR programmes is too large for the client — trim the site list"; exit 1; fi
          gzip -9 -c merged.xml > merged.xml.gz
          ls -la merged.xml.gz
      - name: Split into per-channel buckets
        run: |
          python3 - <<'PY2'
          import re, io, json, os, gzip, collections
          # WHY BUCKETS. Shipping the whole guide to every device does not scale: the full grab is
          # 812MB of XML and tvOS kills the app long before that. Bucketing lets a client ask for
          # ONE channel and receive ~2KB, so coverage stops being limited by device memory.
          #
          # 256 buckets keyed by FNV-1a(coreName) & 0xff. NOT md5: Cloudflare Workers' SubtleCrypto
          # has no MD5, so the worker cannot reproduce an md5 bucket and every lookup would silently
          # return "no programmes". This function is duplicated in worker.js /epg/ch and the two must
          # never diverge. Buckets rather than one file per channel because 80k files is a repo
          # nobody can clone; 256 is small, cacheable, ~300KB each.
          def bucket_of(k):
              h = 0x811c9dc5
              for ch in k.encode():
                  h ^= ch; h = (h * 0x01000193) & 0xffffffff
              return format(h & 0xff, '02x')
          def core(s):
              s = s.lower()
              s = re.sub(r'\b(uk|us|ca|de|it|fr|es|pt|nl|au|nz)\b[:|]*', ' ', s)
              s = re.sub(r'\b(hd|sd|fhd|uhd|4k|8k|hdr|plus|tv|channel)\b', ' ', s)
              return re.sub(r'[^a-z0-9]', '', s)
          body = io.open('merged.xml', encoding='utf-8', errors='ignore').read()
          # id -> display names
          names = {}
          for m in re.finditer(r'<channel\b[^>]*id="([^"]+)"(.*?)</channel>', body, re.S):
              cid, inner = m.group(1), m.group(2)
              names[cid] = re.findall(r'<display-name[^>]*>([^<]+)', inner) or [cid]
          progs = collections.defaultdict(list)
          for m in re.finditer(r'<programme\b([^>]*)>(.*?)</programme>', body, re.S):
              at, inner = m.group(1), m.group(2)
              cid = re.search(r'channel="([^"]+)"', at)
              st  = re.search(r'start="([^"]+)"', at)
              sp  = re.search(r'stop="([^"]+)"', at)
              if not (cid and st and sp): continue
              t = re.search(r'<title[^>]*>(.*?)</title>', inner, re.S)
              d = re.search(r'<desc[^>]*>(.*?)</desc>', inner, re.S)
              def clean(x):
                  if not x: return ''
                  return re.sub(r'<[^>]+>', '', x.group(1)).strip()[:400]
              progs[cid.group(1)].append([st.group(1)[:14], sp.group(1)[:14], clean(t), clean(d)])
          buckets = collections.defaultdict(dict)
          n_keys = 0
          for cid, plist in progs.items():
              if not plist: continue
              plist.sort(key=lambda p: p[0])
              for nm in set(names.get(cid, [cid]) + [cid]):
                  k = core(nm)
                  if len(k) < 3: continue
                  b = bucket_of(k)
                  if k not in buckets[b]:
                      buckets[b][k] = plist; n_keys += 1
          os.makedirs('d/b', exist_ok=True)
          total = 0
          for b, data in buckets.items():
              raw = json.dumps(data, separators=(',', ':'), ensure_ascii=False).encode()
              with gzip.open(f'd/b/{b}.json.gz', 'wb', compresslevel=9) as f: f.write(raw)
              total += os.path.getsize(f'd/b/{b}.json.gz')
          print(f'buckets={len(buckets)} keys={n_keys} total={total/1048576:.1f}MB '
                f'avg={total/max(len(buckets),1)/1024:.0f}KB')
          PY2
          ls d/b | head -3; du -sh d/b

      - name: Publish
        run: |
          cd "$GITHUB_WORKSPACE/self"
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          # Orphan + force-push: the guide is regenerated daily and disposable, so history would
          # grow the repo by its own size every day.
          git checkout --orphan d-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p d
          cp -r "$GITHUB_WORKSPACE/d/b" d/b
          cp "$GITHUB_WORKSPACE/merged.xml.gz" d/guide.xml.gz
          { echo "generated: $(date -u +%FT%TZ)"
            echo "channels:   ${{ steps.merge.outputs.channels }}"
            echo "programmes: ${{ steps.merge.outputs.programmes }}"; } > d/info.txt
          git add -f d
          git commit -q -m "${{ steps.merge.outputs.programmes }} programmes / ${{ steps.merge.outputs.channels }} channels"
          git push -f origin d-tmp:data
          echo published
